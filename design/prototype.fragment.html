<script>
(()=>{
const root=document.getElementById('yidie-preview'),app=root.querySelector('.app'),nav=root.querySelector('.screen-nav');
const screens=[['calendar','月历'],['day','同日展开'],['import','批量导入'],['processing','生成中'],['edit','编辑贴纸'],['gallery','全部记录'],['export','导出月历'],['settings','本地数据'],['empty','首次打开'],['errors','异常状态'],['dense','满月排版']];
const initial=location.hash.slice(1);const state={screen:screens.some(s=>s[0]===initial)?initial:'calendar',month:5,day:12,index:0,cover:0,error:'date',pending:'',angle:0,border:4,empty:false};
if(new URLSearchParams(location.search).has('board')){nav.style.display='none';root.querySelector('.prototype-label').style.display='none';root.querySelector('.stage').style.padding='0';document.body.style.padding='0'}
let entries={10:[0],11:[1],12:[2,0,1,4],16:[3,5,0],18:[4],22:[5,2,1]},toastTimer;
function cut(i,w){return `<span class="cutout" data-asset="${i}" role="img" aria-label="示例穿搭贴纸 ${i+1}" style="${w?'--w:'+w+'px;':''}background-position:${(i%3)*50}% ${i<3?0:100}%"></span>`}
function toast(t){const e=root.querySelector('.toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',2500)}
function header(title,action='完成',go='calendar'){return `<div class="topbar"><button data-go="calendar" aria-label="返回月历">‹ 返回</button><span>${title}</span><button data-go="${go}">${action}</button></div>`}
const denseMonth=new URLSearchParams(location.search).has('six-weeks')?8:7;
function getMonth(){return state.screen==='dense'?denseMonth:state.month+1}
function calendarInner(empty=false,dense=false,poster=false){
  const m=dense?denseMonth:getMonth(),total=new Date(2026,m,0).getDate(),first=new Date(2026,m-1,1).getDay();
  let cells=Array.from({length:first},()=>'<div></div>').join('');
  for(let d=1;d<=total;d++){
    const a=empty?[]:dense?(d%5===0?[d%6,(d+2)%6,(d+4)%6]:[d%6]):m===6?(entries[d]||[]):[];
    let order=a.slice();
    if(d===12&&state.cover<a.length)order=[a[state.cover],...a.filter((_,j)=>j!==state.cover)];
    const visible=order.slice(0,3).reverse(),portrait=order[0]===0||order[0]===1||order[0]===3;
    const sticker=visible.map((i,j)=>{
      const k=visible.length-1-j;
      return `<span class="sticker-layer ${portrait?'portrait':''}" style="--r:${k===0?(d%2?3:-4):k===1?9:-11}deg;--dx:${k===0?0:k===1?4:-4}px;--dy:${k===0?0:k===1?-1:-2}px;z-index:${j}">${cut(i)}</span>`;
    }).join('');
    cells+=`<button class="day ${a.length?'has-sticker':''} ${d>23&&!dense?'future':''} ${d===23&&!dense?'today':''}" data-day="${d}" aria-label="${m}月${d}日，${a.length}张穿搭">${a.length?`<span class="mini-stack">${sticker}</span>`:`<span class="day-num">${d}</span>`}</button>`;
  }
  return `<div class="calendar-head">${poster?'':'<button class="month-arrow" data-month="-1" aria-label="上个月">‹</button>'}<h1>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ’26</h1>${poster?'':'<button class="month-arrow" data-month="1" aria-label="下个月">›</button>'}</div><div class="week" aria-hidden="true">${['日','一','二','三','四','五','六'].map(x=>`<span>${x}</span>`).join('')}</div><div class="month-grid" data-weeks="${Math.ceil((first+total)/7)}">${cells}</div>`;
}
// Visible alpha bounds from the bundled six demo sprites, including crop limits.
// Fit the whole rotated stack, not each person independently.
const spriteBounds=[[49,17,194,458,213,480],[49,12,171,464,214,480],[19,17,181,459,213,480],[53,5,198,453,213,480],[41,1,189,456,214,480],[21,2,169,452,213,480]];
function fitStickers(){
  app.querySelectorAll('.has-sticker').forEach(cell=>{
    const stack=cell.querySelector('.mini-stack');
    stack.style.setProperty('--fit-scale','1');stack.style.setProperty('--fit-x','0px');stack.style.setProperty('--fit-y','0px');
    const boxes=[];
    stack.querySelectorAll('.sticker-layer').forEach(layer=>{
      const picture=layer.querySelector('.cutout'),b=spriteBounds[Number(picture.dataset.asset)];
      const w=picture.offsetWidth,h=picture.offsetHeight,margin=parseFloat(getComputedStyle(picture).marginTop)||0;
      let ink=layer.querySelector('.ink-bounds');if(!ink){ink=document.createElement('span');ink.className='ink-bounds';ink.setAttribute('aria-hidden','true');layer.appendChild(ink)}
      const top=Math.max(0,b[1]/b[5]*h+margin),bottom=Math.min(layer.clientHeight,b[3]/b[5]*h+margin);
      Object.assign(ink.style,{left:b[0]/b[4]*w+'px',top:top+'px',width:(b[2]-b[0])/b[4]*w+'px',height:Math.max(0,bottom-top)+'px'});
      boxes.push(ink.getBoundingClientRect());
    });
    const cellBox=cell.getBoundingClientRect(),left=Math.min(...boxes.map(b=>b.left))-2,right=Math.max(...boxes.map(b=>b.right))+2,top=Math.min(...boxes.map(b=>b.top))-2,bottom=Math.max(...boxes.map(b=>b.bottom))+2;
    const scale=Math.min(1,(cellBox.width-10)/(right-left),(cellBox.height-18)/(bottom-top));
    stack.style.setProperty('--fit-scale',String(scale));
    stack.style.setProperty('--fit-x',((cellBox.left+cellBox.width/2-(left+right)/2)*scale)+'px');
    stack.style.setProperty('--fit-y',((cellBox.top+cellBox.height/2-(top+bottom)/2)*scale)+'px');
  });
}
function calendar(empty=false,dense=false){return `<div class="page ${dense?'dense':''}"><div class="topbar"><span class="brand">衣叠</span><button data-go="export">分享月历</button></div>${calendarInner(empty,dense)}${empty?'<div class="empty-note">把今天，叠进日子里。<p>选几张穿搭照，留下你的第一枚贴纸。</p></div>':''}<div class="calendar-note">${empty?'照片与贴纸，只留在这台 iPhone':dense?'31 天 · 每一天都有自己的样子':'6 个日子，13 张穿搭'}</div><div class="calendar-footer"><button data-go="gallery">全部记录</button><button class="plus" data-add="bulk" aria-label="添加穿搭照片">+</button><button data-go="settings">设置</button></div></div>`}
function day(){const a=entries[state.day]||[];return calendar()+`<button class="dim" data-go="calendar" aria-label="关闭当天穿搭"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="当天穿搭"><div class="grabber"></div><div class="sheet-heading"><h2>6月${state.day}日</h2><button data-add="date">＋ 添加</button></div><p class="sheet-meta">${a.length} 张穿搭 · 左右滑动</p>${a.length?`<div class="reel">${a.map((i,j)=>`<div class="reel-item">${cut(i)}<span class="cover-pill">${j===(state.day===12?state.cover:0)?'月历封面':'穿搭 '+(j+1)}</span></div>`).join('')}</div><div class="sheet-actions"><button class="pill" data-action="cover">设为封面</button><button class="pill" data-go="edit">编辑</button></div><div class="sheet-actions"><button data-action="share">分享贴纸</button><button class="danger" data-action="delete">删除</button></div>`:`<div class="progress-art">${cut(0,92)}</div><p class="sub" style="text-align:center">这一天，等你放一张穿搭。</p><div class="sheet-actions"><button class="primary" data-add="date">为这一天选照片</button></div>`}</section>`}
function importPage(){return `<div class="page">${header('导入照片','取消')}<div class="intro"><h2>先把日子对好。</h2><p class="sub">已选 12 张照片，按拍摄日期分好组。<br>不确定的日期，留给你决定。</p></div>${[[12,[2,0,1,4]],[16,[3,5,0]],[22,[5,2,1]]].map(([d,a])=>`<div class="group-title"><span>6月${d}日</span><small>${a.length} 张 · 拍摄日期</small></div><div class="thumb-row">${a.map(i=>`<div class="thumb">${cut(i)}</div>`).join('')}</div>`).join('')}<div class="pending-box"><strong>2 张照片没有拍摄日期</strong><br>可以先放入待归档，之后再选择日期。<div style="display:flex;gap:5px;margin-top:8px"><button class="pill" data-pending="later" aria-pressed="${!state.pending}">暂存待归档</button><button class="pill" data-pending="today" aria-pressed="${!!state.pending}">放到 6月23日</button></div></div><div class="bottom-action"><button class="primary full" data-go="processing">${state.pending?'导入 12 张照片':'导入 10 张，暂存 2 张'}</button><p class="sub">导入后可随时修改日期</p></div></div>`}
function processing(){return `<div class="page">${header('制作贴纸','收起')}<div class="intro"><h2>正在剪出<br>今天的你。</h2><p class="sub">在这台 iPhone 上处理，照片无需上传。</p></div><div class="progress-art">${cut(3)}</div><progress value="7" max="12" aria-label="已处理7张，共12张"></progress><div class="group-title"><span>7 / 12</span><small>已完成的贴纸可以先看</small></div><p class="sub">离开 App 会暂停，回来后接着处理。</p><div class="bottom-action"><button class="primary full" data-action="finish">演示：查看完成结果</button><button class="full" data-go="calendar">先回月历</button></div></div>`}
function edit(){const a=entries[state.day]||[3];return `<div class="page">${header('编辑贴纸','保存','day')}<div class="hero">${cut(a[state.index]??a[0]??3)}</div><label class="form-row">记录日期<input type="date" value="2026-06-${String(state.day).padStart(2,'0')}" aria-label="记录日期"></label><label class="form-row">旋转 <span class="rotation-value">${state.angle}°</span><input type="range" min="-20" max="20" value="${state.angle}" data-range="rotation" aria-label="旋转角度"></label><label class="form-row">白边 <span class="border-value">${state.border}</span><input type="range" min="0" max="8" value="${state.border}" data-range="border" aria-label="贴纸白边"></label><p class="sub">原照片会保留。抠图不理想时，可以重新选择主体，或保留照片样式。</p><div class="sheet-actions"><button class="pill" data-action="subject">重新选择主体</button><button class="pill" data-action="original">查看原照片</button></div><button class="full danger" data-action="delete">删除这张记录</button></div>`}
function gallery(){return `<div class="page">${header('全部记录','＋','import')}<div class="intro"><h2>你的每一面。</h2><p class="sub">2026年6月 · 13 张穿搭</p><button class="pill" data-go="errors">待归档 · 2</button></div><div class="gallery">${[0,2,3,1,4,5].map((i,j)=>`<button class="gallery-item" data-day="${[10,12,16,11,18,22][j]}">${cut(i)}<span>6月${[10,12,16,11,18,22][j]}日</span></button>`).join('')}</div></div>`}
function exportPage(){return `<div class="page">${header('分享月历')}<div class="intro" style="padding:18px 0"><h2>这一月，很像你。</h2><p class="sub">一张月历，收藏每一天的穿搭。</p></div><div class="poster">${calendarInner(false,false,true)}<div class="poster-caption">六月 · 穿过的日子</div></div><label class="form-row"><span>显示「衣叠」署名</span><input type="checkbox" aria-label="显示衣叠署名"></label><button class="primary full" data-action="poster">保存月历图片</button><button class="full" data-action="share">分享给朋友</button></div>`}
function settings(){return `<div class="page">${header('设置')}<div class="local-mark">你的穿搭，<br>留在你的手机里。</div><p class="sub">无需注册 · 无需联网<br>卸载前，请先导出一份备份。</p><div class="settings-list"><div class="setting"><span>本地空间<small>13 张照片与贴纸 · 示例容量</small></span><b>48.6 MB</b></div><button class="setting" data-action="backup"><span>导出完整备份<small>照片、贴纸、日期一起带走</small></span><b>›</b></button><button class="setting" data-action="restore"><span>从备份恢复<small>恢复前会先检查文件</small></span><b>›</b></button><button class="setting" data-action="github"><span>关于衣叠<small>开源 · Yidie 0.1</small></span><b>›</b></button><button class="setting danger" data-action="clear"><span>清空本地数据</span><b>›</b></button></div><p class="sub" style="margin-top:30px">备份保存到哪里，由你选择。<br>若要始终留在本机，请选择「我的 iPhone」。</p></div>`}
const errorCopy={date:['这两张，拍在哪一天？','照片没有可靠的拍摄日期。选好日子，它们就会回到月历里。','选择记录日期'],cutout:['这张暂时没剪好。','照片已保留，可以再试一次，也可以用照片样式记录今天。','重新生成贴纸'],cloud:['照片还没下载到手机。','请先在系统相册下载原照片，再回到衣叠导入。','保留待处理'],permission:['选几张照片就好。','只需允许访问你选中的照片，就可以开始记录。','选择照片']};
function errors(){const c=errorCopy[state.error];return `<div class="page">${header('待处理')}<div class="error-choices">${[['date','日期缺失'],['cutout','抠图失败'],['cloud','照片未下载'],['permission','照片权限']].map(([k,t])=>`<button data-error="${k}" aria-pressed="${k===state.error}">${t}</button>`).join('')}</div><div class="error-image">${cut(3)}</div><h2>${c[0]}</h2><p class="sub">${c[1]}</p>${state.error==='date'?'<label class="form-row">记录日期<input type="date" value="2026-06-23" aria-label="待归档日期"></label>':''}<div class="bottom-action"><button class="primary full" data-action="resolve">${c[2]}</button><button class="full" data-go="gallery">稍后处理</button></div></div>`}
function modal(title,body,action){app.insertAdjacentHTML('beforeend',`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${body}</p><div class="modal-actions"><button data-action="cancel" class="pill">取消</button><button data-confirm="${action}" class="primary">确认</button></div></section></div>`)}
function render(){nav.innerHTML=screens.map(([k,t])=>`<button class="cursor-interaction" data-go="${k}" aria-pressed="${state.screen===k}">${t}</button>`).join('');const views={calendar:()=>calendar(),dense:()=>calendar(false,true),empty:()=>calendar(true),day,import:importPage,processing,edit,gallery,export:exportPage,settings,errors};app.innerHTML=(views[state.screen]||views.calendar)();app.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));app.querySelectorAll('.stack-piece').forEach(e=>{const child=e.firstElementChild;child.style.cssText+=';'+e.getAttribute('style');e.replaceWith(child)});const reel=app.querySelector('.reel');if(reel){reel.addEventListener('scroll',()=>{state.index=Math.round(reel.scrollLeft/(reel.firstElementChild?.getBoundingClientRect().width+16||1))},{passive:true})}fitStickers();if(state.screen==='edit')updateHero()}
function updateHero(){const e=app.querySelector('.hero .cutout');if(e){e.style.transform=`rotate(${state.angle}deg)`;e.style.filter=`drop-shadow(0 0 ${state.border/2}px white) drop-shadow(0 4px 5px #0002)`}}
root.addEventListener('input',e=>{if(e.target.dataset.range==='rotation'){state.angle=+e.target.value;app.querySelector('.rotation-value').textContent=state.angle+'°';updateHero()}if(e.target.dataset.range==='border'){state.border=+e.target.value;app.querySelector('.border-value').textContent=state.border;updateHero()}});
root.addEventListener('change',e=>{if(e.target.tagName==='SELECT'){state.pending=e.target.value;app.querySelector('.bottom-action .primary').textContent=state.pending?'导入 12 张照片':'导入 10 张，暂存 2 张'}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pending){state.pending=b.dataset.pending==='today'?'2026-06-23':'';render();return}if(b.dataset.go){if(state.screen==='edit'&&b.dataset.go==='day')toast('演示：日期与贴纸样式已保存');state.screen=b.dataset.go;state.index=0;render();return}if(b.dataset.month){state.month=(state.month+Number(b.dataset.month)+12)%12;render();return}if(b.dataset.day){state.day=+b.dataset.day;state.index=0;state.screen='day';render();return}if(b.dataset.error){state.error=b.dataset.error;render();return}if(b.dataset.add){if(b.dataset.add==='date'){modal('添加到 6月'+state.day+'日','从相册选中的照片都会放在这一天，拍摄日期不会改变你的选择。','add-date')}else{state.screen='import';render()}return}if(b.dataset.confirm){const a=b.dataset.confirm;app.querySelector('.modal-wrap')?.remove();if(a==='delete'){entries[state.day]?.splice(state.index,1);state.index=0;state.screen='day';render();toast('演示：已删除这张记录')}else if(a==='clear'){entries={};state.screen='empty';render();toast('演示：示例记录已清空，刷新可重置')}else if(a==='add-date'){entries[state.day]=[...(entries[state.day]||[]),3];state.screen='day';render();toast('演示：贴纸已加入指定日期')}else toast('原型演示：正式 App 将调用系统文件选择');return}const a=b.dataset.action;if(!a)return;if(a==='cancel'){app.querySelector('.modal-wrap')?.remove();return}if(a==='cover'){if(state.day===12)state.cover=state.index;render();toast('演示：当前贴纸已设为月历封面')}else if(a==='delete')modal('删除这张记录？','只删除衣叠内的记录，系统相册里的照片会保留。','delete');else if(a==='clear')modal('清空本地数据？','删除后无法撤销。建议先导出完整备份。','clear');else if(a==='backup')modal('导出完整备份','正式 App 会把照片、贴纸和日期打包，由你选择保存位置。','backup');else if(a==='restore')modal('从备份恢复','检查通过后，显示备份日期和记录数量。确认替换前会保留当前数据的安全副本。','restore');else if(a==='finish'){state.screen='calendar';render();toast('演示：10 张已归档，2 张等待选择日期')}else if(a==='resolve'){state.screen='calendar';render();toast('演示：处理结果已返回月历')}else if(a==='github')modal('衣叠 · Yidie','把穿过的日子，一张张叠起来。开源项目，仓库地址将在发布时填写。','about');else if(a==='subject')toast('设计预留：多人照片中点击想保留的主体');else if(a==='original')toast('示例素材只有贴纸；正式 App 会展示导入的原照片');else if(a==='poster')toast('原型演示：正式 App 将导出高清 PNG');else toast('原型演示：正式 App 将打开 iOS 分享面板')});render();
new ResizeObserver(()=>fitStickers()).observe(root);
})();
</script>
